<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SindromeGames — Acesso</title>
    <style>
        /* DESIGN MINIMALISTA (PRETO E BRANCO)
        */
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --border: #e0e0e0;
            --accent: #000000;
            --secondary: #757575;
            --error: #ba0000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Container Principal */
        .auth-container {
            width: 100%;
            max-width: 400px;
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        p.subtitle {
            color: var(--secondary);
            font-size: 0.9rem;
            margin-bottom: 40px;
        }

        /* Formulários */
        .form-panel {
            display: none;
            flex-direction: column;
            gap: 20px;
            animation: fadeIn 0.4s ease-out;
        }

        .form-panel.active {
            display: flex;
        }

        .input-group {
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: var(--secondary);
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent);
        }

        /* Botões */
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent);
            color: white;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.85;
        }

        .switch-text {
            margin-top: 25px;
            font-size: 0.85rem;
            color: var(--secondary);
        }

        .switch-text a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px solid transparent;
        }

        .switch-text a:hover {
            border-bottom: 1px solid var(--accent);
        }

        /* Mensagens de Erro/Sucesso */
        .msg {
            font-size: 0.8rem;
            margin-top: -10px;
            text-align: left;
            display: none;
        }

        .msg.error { color: var(--error); display: block; }
        .msg.success { color: #2e7d32; display: block; }

        /* Overlay de Carregamento */
        #loadingOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fff;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #loadingOverlay.visible { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <h2 id="loadingText">Entrando...</h2>
    </div>

    <div class="auth-container">
        <h1>Sindrome Games</h1>
        <p class="subtitle">Portal de Acesso</p>

        <div id="loginPanel" class="form-panel active">
            <div class="input-group">
                <label>Usuário</label>
                <input type="text" id="loginUser" placeholder="Seu nome de usuário">
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="loginPass" placeholder="••••••••">
            </div>
            <div id="loginMsg" class="msg"></div>
            <button id="btnEnter">Entrar</button>
            <p class="switch-text">
                Não tem conta? <a href="#" id="toRegister">Criar uma agora</a>
            </p>
        </div>

        <div id="registerPanel" class="form-panel">
            <div class="input-group">
                <label>Criar Usuário</label>
                <input type="text" id="regUser" placeholder="Ex: felipe_dev">
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="regPass" placeholder="Mínimo 6 caracteres">
            </div>
            <div id="regMsg" class="msg"></div>
            <button id="btnCreate">Cadastrar</button>
            <p class="switch-text">
                Já é cadastrado? <a href="#" id="toLogin">Fazer Login</a>
            </p>
        </div>
    </div>

    <script>
        const REDIRECT_URL = 'https://www.youtube.com/@SindromeGames';
        
        // Simulação de Banco de Dados no Navegador
        const DB = {
            getUsers: () => JSON.parse(localStorage.getItem('users') || '[]'),
            saveUser: (user) => {
                const users = DB.getUsers();
                users.push(user);
                localStorage.setItem('users', JSON.stringify(users));
            },
            setCurrentSession: (username) => localStorage.setItem('session', username),
            getSession: () => localStorage.getItem('session'),
            clearSession: () => localStorage.removeItem('session')
        };

        // Elementos
        const loginPanel = document.getElementById('loginPanel');
        const registerPanel = document.getElementById('registerPanel');
        const overlay = document.getElementById('loadingOverlay');

        // Alternar entre Telas
        document.getElementById('toRegister').onclick = (e) => {
            e.preventDefault();
            loginPanel.classList.remove('active');
            registerPanel.classList.add('active');
        };

        document.getElementById('toLogin').onclick = (e) => {
            e.preventDefault();
            registerPanel.classList.remove('active');
            loginPanel.classList.add('active');
        };

        // Função de Redirecionamento
        function redirect(name) {
            document.getElementById('loadingText').innerText = `Bem-vindo, ${name}`;
            overlay.classList.add('visible');
            setTimeout(() => {
                window.location.href = REDIRECT_URL;
            }, 2000);
        }

        // Lógica de Registro
        document.getElementById('btnCreate').onclick = () => {
            const user = document.getElementById('regUser').value.trim();
            const pass = document.getElementById('regPass').value;
            const msg = document.getElementById('regMsg');

            if (user.length < 3 || pass.length < 6) {
                msg.innerText = "Usuário (min. 3) ou senha (min. 6) muito curtos.";
                msg.className = "msg error";
                return;
            }

            const users = DB.getUsers();
            if (users.find(u => u.username === user)) {
                msg.innerText = "Este usuário já existe.";
                msg.className = "msg error";
                return;
            }

            DB.saveUser({ username: user, password: pass });
            DB.setCurrentSession(user);
            redirect(user);
        };

        // Lógica de Login
        document.getElementById('btnEnter').onclick = () => {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value;
            const msg = document.getElementById('loginMsg');

            const users = DB.getUsers();
            const found = users.find(u => u.username === user && u.password === pass);

            if (found) {
                DB.setCurrentSession(user);
                redirect(user);
            } else {
                msg.innerText = "Usuário ou senha incorretos.";
                msg.className = "msg error";
            }
        };

        // Verificar se já está logado ao abrir o site
        window.onload = () => {
            const session = DB.getSession();
            if (session) {
                redirect(session);
            }
        };
    </script>
</body>
</html>
