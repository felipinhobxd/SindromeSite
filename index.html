<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sindrome Games | Links Oficiais</title>
    
    <!-- Meta Tags de Cor de Tema (Mobile Integration) -->
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- SEO & Meta Tags -->
    <meta name="description" content="Conecte-se com a gente em todas as plataformas - Sindrome Games">
    <meta name="author" content="Sindrome Games">
    
    <!-- Open Graph -->
    <meta property="og:title" content="Sindrome Games | Links Oficiais">
    <meta property="og:image" content="assets/img/avatar.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/img/avatar.png">
    
    <!-- Preload critical assets -->
    <link rel="preload" href="assets/img/avatar.png" as="image">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Styles -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <canvas id="particle-canvas"></canvas>

    <div class="container">
        <header class="profile-header">
            <div class="avatar-container">
                <img src="assets/img/avatar.png" 
                     srcset="assets/img/avatar.png 1x, assets/img/avatar.png 2x" 
                     alt="Sindrome Games" 
                     class="avatar"
                     loading="eager">
                <div class="avatar-glow"></div>
            </div>
            <div class="brand">
                <h1 class="brand-line">SINDROME</h1>
                <h1 class="brand-line">GAMES</h1>
            </div>
            <p class="tagline">Conecte-se com a gente em todas as plataformas</p>
        </header>

        <nav class="social-quick-links">
            <a href="https://www.tiktok.com/@sindromegames" target="_blank" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
            <a href="https://www.youtube.com/@SindromeGames" target="_blank" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
            <a href="https://www.twitch.tv/sindromegames" target="_blank" title="Twitch"><i class="fa-brands fa-twitch"></i></a>
            <a href="https://www.instagram.com/sindromegames" target="_blank" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
        </nav>

        <main class="links-container">
            <a href="https://www.youtube.com/@SindromeGames" target="_blank" class="link-card" rel="noopener noreferrer">
                <div class="link-inner">
                    <i class="fa-brands fa-youtube"></i>
                    <span class="link-title">YouTube</span>
                </div>
            </a>

            <a href="https://www.tiktok.com/@sindromegames" target="_blank" class="link-card" rel="noopener noreferrer">
                <div class="link-inner">
                    <i class="fa-brands fa-tiktok"></i>
                    <span class="link-title">TikTok</span>
                </div>
            </a>

            <a href="https://www.instagram.com/sindromegames" target="_blank" class="link-card" rel="noopener noreferrer">
                <div class="link-inner">
                    <i class="fa-brands fa-instagram"></i>
                    <span class="link-title">Instagram</span>
                </div>
            </a>

            <a href="https://www.twitch.tv/sindromegames" target="_blank" class="link-card" rel="noopener noreferrer">
                <div class="link-inner">
                    <i class="fa-brands fa-twitch"></i>
                    <span class="link-title">Twitch</span>
                </div>
            </a>
        </main>
        
        <footer class="footer-credits">
            &copy; 2026 Sindrome Games
        </footer>
    </div>

    <!-- Scripts -->
    <script src="assets/js/particles.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
